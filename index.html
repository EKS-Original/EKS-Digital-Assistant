<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKS AI Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
        }
        .header {
            background-color: #0056b3;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .header p {
            margin: 5px 0 0;
            font-size: 14px;
            color: #d1e8ff;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #fafafa;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .message.user {
            align-items: flex-end;
        }
        .message.bot {
            align-items: flex-start;
        }
        .message .text {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
        }
        .message.user .text {
            background-color: #0056b3;
            color: #ffffff;
            border-bottom-right-radius: 0;
        }
        .message.bot .text {
            background-color: #e9ecef;
            color: #333333;
            border-bottom-left-radius: 0;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid #ddd;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            outline: none;
        }
        .input-area button {
            background-color: #0056b3;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .input-area button:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>EKS AI Assistant</h1>
        <p>Welcome EKS Member</p>
    </div>
    
    <div class="chat-box" id="chat-box">
        <div class="message bot">
            <div class="text">မင်္ဂလာပါ EKS Member ခင်ဗျာ။ ကျွန်တော်က EKS (Electrical Knowledge Sharing) ရဲ့ AI Assistant ဖြစ်ပါတယ်။ လျှပ်စစ်အင်ဂျင်နီယာပိုင်း၊ Power Systems, Wiring နဲ့ MEP ပိုင်းဆိုင်ရာတွေကို မေးမြန်းနိုင်ပါတယ်။</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="မေးခွန်းကို ဤနေရာတွင် ရိုက်ထည့်ပါ..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // သင့်ရဲ့ Gemini API Key ကို ဒီနေရာမှာ ထည့်ပေးပါ။ 
    // သတိပြုရန် - Public GitHub Repository မှာ API Key အစစ်ကို တင်ထားပါက အခြားသူများ ယူသုံးနိုင်ပါတယ်။
    const API_KEY = 'AIzaSyCTMh-nLBBRE9HcXsjIfL94SUHDc5ZDgHI'; 
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    // EKS အတွက် သီးသန့်သတ်မှတ်ထားသော စည်းမျဉ်း (System Prompt)
    const systemInstruction = "You are an elite Electrical Engineering AI assistant strictly designed for the EKS (Electrical Knowledge Sharing) platform. Always address the user respectfully as 'EKS Member'. You must ONLY answer questions related to electrical engineering, power systems, wiring, MEP coordination, electrical calculations, and electrical problem-solving. If a user asks any question outside of the electrical engineering domain, politely decline and remind them that this engine is exclusively for electrical knowledge. Provide accurate, professional, and practical answers. Respond in Myanmar (Burmese) language.";

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        userInput.value = '';

        const typingId = appendMessage('bot', 'စင်းစားနေပါတယ်...');

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    system_instruction: {
                        parts: [{ text: systemInstruction }]
                    },
                    contents: [{
                        parts: [{ text: text }]
                    }]
                })
            });

            const data = await response.json();
            
            // API မှ ပြန်လာသော အဖြေကို ရယူခြင်း
            if(data.candidates && data.candidates[0].content.parts[0].text) {
                updateMessage(typingId, data.candidates[0].content.parts[0].text);
            } else {
                updateMessage(typingId, "တောင်းပန်ပါတယ်။ အဖြေရှာရာတွင် အခက်အခဲရှိနေပါသည်။");
            }

        } catch (error) {
            console.error("Error:", error);
            updateMessage(typingId, "API ချိတ်ဆက်မှု အမှားအယွင်းဖြစ်နေပါသည်။ API Key မှန်ကန်မှုရှိမရှိ စစ်ဆေးပါ။");
        }
    }

    function appendMessage(sender, text) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', sender);
        const id = 'msg-' + Date.now();
        messageDiv.id = id;

        const textDiv = document.createElement('div');
        textDiv.classList.add('text');
        
        // Convert Markdown formatting (like **bold**) to HTML if necessary, or just display text
        textDiv.innerText = text; 

        messageDiv.appendChild(textDiv);
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        
        return id;
    }

    function updateMessage(id, text) {
        const messageDiv = document.getElementById(id);
        if (messageDiv) {
            messageDiv.querySelector('.text').innerText = text;
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
